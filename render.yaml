# Render Blueprint — backend'i "New + → Blueprint" ile tek tıkla kurar.
# Render, bu depoyu bağladığınızda bu dosyayı otomatik bulur.
services:
  - type: web
    name: nar-lokantasi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PIN
        sync: false # Render panelinde elle girilir, repoya yazılmaz
      - key: CORS_ORIGINS
        value: https://qr-kodlu-menu-beta.vercel.app,http://localhost:5173
